<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GutLog – Auswertung</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--green:#4A7C59;--gd:#2C5F3F;--gp:#EEF5F0;--gl:#C8E6C9;--bg:#F2F5F2;--text:#1E2E25;--mut:#7A9080;--amb:#E8924A;--ap:#FDF0E6;--red:#C0392B;--rp:#FDECEA;--pur:#7B5EA7;--pp:#f0ebf8;--bd:#D4E4D8;--sh:0 2px 14px rgba(30,46,37,.09);--r:14px}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.6}
header{background:var(--gd);color:#fff;padding:20px 32px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.hb h1{font-family:'DM Serif Display',serif;font-size:1.5rem;font-weight:400}
.hb p{font-size:.75rem;opacity:.65;margin-top:2px}
.badge{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:.72rem;font-weight:600;padding:5px 12px;border-radius:20px}
.main{max-width:900px;margin:0 auto;padding:28px 20px 60px}

/* CONFIG */
.cfg{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:22px;margin-bottom:24px;border-left:4px solid var(--green)}
.cfg h2{font-family:'DM Serif Display',serif;font-size:1.1rem;margin-bottom:6px}
.cfg p{font-size:.82rem;color:var(--mut);margin-bottom:16px;line-height:1.6}
.cfg-row{display:grid;grid-template-columns:1fr 1fr 160px;gap:10px;align-items:end}
.cfg-group{display:flex;flex-direction:column;gap:5px}
.cfg-label{font-size:.72rem;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.cfg-input{padding:9px 11px;border:1.5px solid var(--bd);border-radius:9px;font-family:'Inter',sans-serif;font-size:.84rem;color:var(--text);background:var(--bg);outline:none;-webkit-appearance:none;width:100%}
.cfg-input:focus{border-color:var(--green);background:#fff}
.cfg-btn{padding:10px 18px;background:var(--gd);color:#fff;border:none;border-radius:9px;cursor:pointer;font-family:'Inter',sans-serif;font-size:.84rem;font-weight:600;white-space:nowrap;transition:background .15s;width:100%}
.cfg-btn:hover{background:#234d30}
.cfg-status{margin-top:10px;font-size:.78rem;padding:8px 12px;border-radius:8px;display:none}
.cs-ok{background:var(--gp);color:var(--green);display:block}
.cs-err{background:var(--rp);color:var(--red);display:block}
.cs-info{background:var(--ap);color:#c0621a;display:block}

/* WEEK NAV */
.week-bar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.wnav{background:#fff;border:1.5px solid var(--bd);border-radius:9px;padding:7px 13px;cursor:pointer;font-family:'Inter',sans-serif;font-size:.82rem;color:var(--text);transition:all .15s;box-shadow:0 1px 6px rgba(30,46,37,.07)}
.wnav:hover:not(:disabled){border-color:var(--green);color:var(--green)}
.wnav:disabled{opacity:.35;cursor:not-allowed}
.wlbl{font-weight:600;font-size:.92rem}
.reload-btn{background:var(--gp);border:1.5px solid var(--gl);border-radius:9px;padding:7px 13px;cursor:pointer;font-family:'Inter',sans-serif;font-size:.82rem;color:var(--green);font-weight:600;transition:all .15s}
.reload-btn:hover{background:var(--gl)}

/* STATS */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.sc{background:#fff;border-radius:var(--r);padding:16px;box-shadow:0 1px 6px rgba(30,46,37,.07);text-align:center}
.sn{font-family:'DM Serif Display',serif;font-size:1.9rem;color:var(--green);line-height:1}
.sl{font-size:.72rem;color:var(--mut);margin-top:5px;line-height:1.3}

/* AI CARD */
.aic{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:24px;margin-bottom:20px;border-left:4px solid var(--green)}
.aih{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.aip{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--green);background:var(--gp);padding:3px 10px;border-radius:10px}
.ait{font-family:'DM Serif Display',serif;font-size:1.15rem}
.ai-text{font-size:.9rem;line-height:1.9;white-space:pre-wrap;color:var(--text)}
.ai-text strong{color:var(--gd)}
.loading{display:flex;align-items:center;gap:12px;color:var(--mut);font-size:.88rem;padding:12px 0}
.spinner{width:20px;height:20px;border:2.5px solid var(--bd);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* CHARTS */
.cb{background:#fff;border-radius:var(--r);padding:18px;box-shadow:0 1px 6px rgba(30,46,37,.07);margin-bottom:14px}
.cbt{font-weight:600;font-size:.85rem;margin-bottom:12px}
.br{display:flex;align-items:center;gap:9px;margin-bottom:8px;font-size:.82rem}
.bl{min-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bbg{flex:1;height:7px;background:var(--bg);border-radius:4px;overflow:hidden}
.bf{height:100%;border-radius:4px}.bfs{background:var(--amb)}.bft{background:linear-gradient(90deg,var(--amb),var(--red))}
.bc{font-size:.73rem;color:var(--mut);min-width:28px;text-align:right}
.cn{font-size:.72rem;color:var(--mut);margin-top:10px;line-height:1.5}

/* TIMELINE */
.tls{background:#fff;border-radius:var(--r);padding:20px;box-shadow:0 1px 6px rgba(30,46,37,.07);margin-bottom:20px}
.tlst{font-weight:700;font-size:.78rem;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px}
.dblock{margin-bottom:22px}
.dlbl{font-family:'DM Serif Display',serif;font-size:.95rem;border-bottom:1px solid var(--bd);padding-bottom:5px;margin-bottom:10px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pill{padding:3px 10px;border-radius:20px;font-size:.7rem;font-weight:600}
.pm{background:var(--gp);color:var(--green)}.ps{background:var(--ap);color:#c0621a}.pd{background:var(--pp);color:var(--pur)}
.tl{position:relative;padding-left:22px}
.tl::before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:linear-gradient(to bottom,var(--gl),var(--bd));border-radius:2px}
.tle{position:relative;margin-bottom:10px}
.tld{position:absolute;left:-18px;top:12px;width:12px;height:12px;border-radius:50%;border:2px solid var(--bg)}
.dm{background:var(--green)}.ds{background:var(--amb)}.dd{background:var(--pur)}
.ec{border-radius:10px;padding:10px 12px;border-left:3px solid transparent;background:#fff;box-shadow:0 1px 6px rgba(30,46,37,.07)}
.ecm{border-left-color:var(--green)}.ecs{border-left-color:var(--amb)}.ecd{border-left-color:var(--pur)}
.ct{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.cti{font-size:.68rem;font-weight:700;color:var(--mut);text-transform:uppercase}
.cbadge{font-size:.68rem;font-weight:600;padding:2px 7px;border-radius:8px}
.bm{background:var(--gp);color:var(--green)}.bs{background:var(--ap);color:#c0621a}.bd2{background:var(--pp);color:var(--pur)}
.cm{font-size:.88rem;font-weight:500}.cd{font-size:.76rem;color:var(--mut)}
.stgs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.stg{font-size:.68rem;padding:2px 7px;background:var(--ap);color:#c0621a;border-radius:8px}
.sb{height:3px;background:var(--bd);border-radius:2px;margin-top:6px;overflow:hidden}
.sf{height:100%;border-radius:2px;background:linear-gradient(90deg,#f9c74f,var(--amb),var(--red))}

.empty{text-align:center;padding:48px 20px;color:var(--mut)}
.empty-icon{font-size:2.6rem;margin-bottom:12px}
.err-box{background:var(--rp);border:1.5px solid var(--red);border-radius:var(--r);padding:16px 20px;color:var(--red);font-size:.88rem;margin-bottom:20px}

@media(max-width:700px){
  header{padding:16px}.main{padding:16px 14px 40px}
  .sgrid{grid-template-columns:1fr 1fr}.sgrid .sc:last-child{grid-column:span 2}
  .cfg-row{grid-template-columns:1fr}.bl{min-width:90px}
}
</style>
</head>
<body>
<header>
  <div class="hb"><h1>📊 GutLog Auswertung</h1><p>Ärztliches Analyse-Tool</p></div>
  <div class="badge">Nur für Arzt</div>
</header>
<div class="main">

  <!-- IMPORT -->
  <div class="cfg">
    <h2>📥 Bericht laden</h2>
    <p>Öffne die Datei, die Fabienne aus GutLog geteilt hat (.txt), oder füge den Text aus WhatsApp unten ein.</p>
    <input type="file" id="fileIn" accept=".txt,.json,text/plain,application/json" style="display:none" onchange="loadFile(this.files[0])">
    <button class="cfg-btn" style="width:auto;margin-bottom:14px" onclick="document.getElementById('fileIn').click()">Datei auswählen</button>
    <textarea class="cfg-input" id="pasteIn" style="min-height:110px;resize:vertical" placeholder="…oder den kompletten Bericht hier einfügen"></textarea>
    <button class="cfg-btn" style="width:auto;margin-top:10px" onclick="loadText(document.getElementById('pasteIn').value)">Auswerten</button>
    <div id="cfgStatus" class="cfg-status"></div>
  </div>

  <div id="mainContent"></div>
</div>

<script>
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

// ── BERICHT EINLESEN ──────────────────────────────
const MARKER='=== GUTLOG-DATEN';
function setCfgStatus(type,msg){
  const el=document.getElementById('cfgStatus');
  el.className='cfg-status'+(type==='ok'?' cs-ok':type==='err'?' cs-err':' cs-info');
  el.textContent=msg;
}
function loadFile(file){
  if(!file)return;
  const r=new FileReader();
  r.onload=e=>loadText(e.target.result);
  r.readAsText(file);
}
function loadText(text){
  text=(text||'').trim();
  if(!text){setCfgStatus('err','Bitte zuerst eine Datei wählen oder Text einfügen.');return}
  let data=null;
  try{
    const i=text.indexOf(MARKER);
    if(i>=0){
      // Die JSON-Zeile steht direkt nach der Marker-Zeile
      const after=text.slice(text.indexOf('\n',i)+1);
      data=JSON.parse(after.slice(after.indexOf('{'),after.lastIndexOf('}')+1));
    }else{
      data=JSON.parse(text); // ältere .json-Exporte
    }
  }catch{data=null}
  if(!data||!data.days){setCfgStatus('err','Kein GutLog-Bericht erkannt. Bitte den kompletten Bericht inklusive Datenblock verwenden.');return}
  setCfgStatus('ok','✓ Bericht geladen');
  render(data.days, data.range?`${data.range.from} bis ${data.range.to}`:'Wochenbericht');
}

// ── RENDER ────────────────────────────────────────
async function render(wd,label){
  const keys=Object.keys(wd).sort();
  const all=Object.values(wd).flat();
  const syms=all.filter(e=>e.type==='symptom'),meals=all.filter(e=>e.type==='meal');
  const panto=keys.filter(k=>wd[k].some(e=>e.type==='medication'&&(e.name||'').toLowerCase().includes('pantoprazol'))).length;
  const avgS=syms.length?(syms.reduce((s,e)=>s+e.severity,0)/syms.length).toFixed(1):'–';
  const maxS=syms.length?Math.max(...syms.map(e=>e.severity)):0;

  const sF={};syms.forEach(e=>(e.symptoms||[]).forEach(s=>{sF[s]=(sF[s]||0)+1}));
  const sByF=Object.entries(sF).sort((a,b)=>b[1]-a[1]),sMax=sByF[0]?.[1]||1;
  const trig={};
  Object.values(wd).forEach(day=>{const sorted=[...day].sort((a,b)=>(a.time||'').localeCompare(b.time||''));sorted.forEach((e,i)=>{if(e.type!=='symptom')return;const[sh,sm]=(e.time||'00:00').split(':').map(Number);sorted.slice(0,i).forEach(p=>{if(p.type!=='meal')return;const[ph,pm]=(p.time||'00:00').split(':').map(Number);if((sh*60+sm)-(ph*60+pm)<=120)trig[p.name]=(trig[p.name]||0)+1})})});
  const tByF=Object.entries(trig).sort((a,b)=>b[1]-a[1]).slice(0,6),tMax=tByF[0]?.[1]||1;

  // Timeline
  const L={meal:'🍽 Mahlzeit',symptom:'⚡ Symptom',medication:'💊 Medikament'};
  const DC={meal:'dm',symptom:'ds',medication:'dd'};
  const CC={meal:'ecm',symptom:'ecs',medication:'ecd'};
  const BC={meal:'bm',symptom:'bs',medication:'bd2'};
  const tlHTML=keys.length?keys.map(key=>{
    const d=new Date(key+'T12:00:00');
    const label=d.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
    const nM=wd[key].filter(e=>e.type==='meal').length,nS=wd[key].filter(e=>e.type==='symptom').length,nMe=wd[key].filter(e=>e.type==='medication').length;
    const cards=wd[key].map(e=>{
      let body='';
      if(e.type==='meal')body=`<div class="cm">${esc(e.name||'')}</div>${e.details?`<div class="cd">${esc(e.details)}</div>`:''}${e.drink?`<div class="cd">🥤 ${esc(e.drink)}</div>`:''}`;
      else if(e.type==='symptom')body=`<div class="stgs">${(e.symptoms||[]).map(s=>`<span class="stg">${esc(s)}</span>`).join('')}</div><div class="sb"><div class="sf" style="width:${(e.severity||5)*10}%"></div></div><div class="cd" style="margin-top:4px">Intensität ${e.severity}/10${e.timing?' · '+esc(e.timing):''}</div>${e.note?`<div class="cd">${esc(e.note)}</div>`:''}`;
      else body=`<div class="cm">${esc(e.name||'')}${e.dose?' – '+esc(e.dose)+' mg':''}</div><div class="cd">${esc(e.timing||'')}</div>${e.note?`<div class="cd">${esc(e.note)}</div>`:''}`;
      return`<div class="tle"><div class="tld ${DC[e.type]||'dm'}"></div><div class="ec ${CC[e.type]||'ecm'}"><div class="ct"><span class="cti">${esc(e.time||'')} Uhr</span><span class="cbadge ${BC[e.type]||'bm'}">${L[e.type]||e.type}</span></div>${body}</div></div>`;
    }).join('');
    return`<div class="dblock"><div class="dlbl">${esc(label)}</div><div class="pills">${nM?`<span class="pill pm">🍽 ${nM}</span>`:''}${nS?`<span class="pill ps">⚡ ${nS}</span>`:''}${nMe?`<span class="pill pd">💊 ${nMe}</span>`:''}</div><div class="tl">${cards}</div></div>`;
  }).join(''):'<p style="color:var(--mut);font-size:.88rem">Keine Einträge für diese Woche.</p>';

  document.getElementById('mainContent').innerHTML=`
    <div class="week-bar"><span class="wlbl">${esc(label||"")}</span></div>

    ${!keys.length?`<div class="empty"><div class="empty-icon">📭</div><p>Keine Einträge für diese Woche.</p></div>`:`
    <div class="sgrid">
      <div class="sc"><div class="sn">${keys.length}</div><div class="sl">Tage erfasst</div></div>
      <div class="sc"><div class="sn" style="color:var(--amb)">${syms.length}</div><div class="sl">Symptom&shy;ereignisse</div></div>
      <div class="sc"><div class="sn" style="color:var(--amb)">${avgS}</div><div class="sl">Ø Intensität</div></div>
      <div class="sc"><div class="sn">${meals.length}</div><div class="sl">Mahlzeiten</div></div>
      <div class="sc"><div class="sn" style="color:var(--pur)">${panto}/7</div><div class="sl">Tage Pantoprazol</div></div>
      <div class="sc"><div class="sn" style="color:var(--green)">${7-panto}/7</div><div class="sl">Tage ohne</div></div>
    </div>

    <div class="aic">
      <div class="aih"><span class="aip">📊 Auswertung</span><span class="ait">Automatische Zusammenfassung</span></div>
      <div id="aiResult"><div class="loading"><div class="spinner"></div>Wird ausgewertet…</div></div>
    </div>

    ${sByF.length?`<div class="cb"><div class="cbt">Häufigste Symptome</div>${sByF.map(([s,n])=>`<div class="br"><span class="bl">${esc(s)}</span><div class="bbg"><div class="bf bfs" style="width:${(n/sMax*100).toFixed(0)}%"></div></div><span class="bc">${n}×</span></div>`).join('')}</div>`:''}
    ${tByF.length?`<div class="cb"><div class="cbt">Mögliche Trigger <span style="font-weight:400;color:var(--mut)">(Symptome innerhalb 2h)</span></div>${tByF.map(([m,n])=>`<div class="br"><span class="bl">${esc(m)}</span><div class="bbg"><div class="bf bft" style="width:${(n/tMax*100).toFixed(0)}%"></div></div><span class="bc">${n}×</span></div>`).join('')}<div class="cn">⚠ Rein zeitliche Korrelation.</div></div>`:''}
    <div class="tls"><div class="tlst">Tagesprotokoll</div>${tlHTML}</div>`}`;

  if(keys.length) await runAI(wd,keys,syms,meals,panto,avgS,maxS,sByF,tByF);
}


// ── AI ────────────────────────────────────────────
async function runAI(wd,keys,syms,meals,panto,avgS,maxS,sByF,tByF){
  const raw=keys.map(key=>{
    const d=new Date(key+'T12:00:00');
    const lines=[`📅 ${d.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'})}`];
    wd[key].filter(e=>e.type==='meal').forEach(m=>lines.push(`  🍽 ${m.time}: ${m.name}${m.details?' ('+m.details+')':''}${m.drink?' + '+m.drink:''}`));
    wd[key].filter(e=>e.type==='symptom').forEach(s=>lines.push(`  ⚡ ${s.time}: ${(s.symptoms||[]).join(', ')} – Stärke ${s.severity}/10${s.timing?' ('+s.timing+')':''}${s.note?' – '+s.note:''}`));
    wd[key].filter(e=>e.type==='medication').forEach(m=>lines.push(`  💊 ${m.time}: ${m.name||''} ${m.dose||''}mg – ${m.timing||''}${m.note?' ('+m.note+')':''}`));
    return lines.join('\n');
  }).join('\n\n');

  // Lokale Auswertung. Für eine ausführliche KI-Analyse: Bericht im Claude-Chat hochladen.
  showAI(localAnalysis(wd,keys,syms,panto,avgS,maxS,sByF,tByF));
}

function showAI(text){
  const el=document.getElementById('aiResult');if(!el)return;
  el.innerHTML=`<div class="ai-text">${text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')}</div>`;
}

function localAnalysis(wd,keys,syms,panto,avgS,maxS,sByF,tByF){
  const days=keys.length;
  const topSyms=sByF.slice(0,3),topTrig=tByF.slice(0,2);
  const nightS=syms.filter(e=>(e.timing||'').match(/Lieg|nacht/i)).length;
  const stressS=syms.filter(e=>(e.timing||'').match(/Stress/i)).length;
  let t='';
  t+=`📊 Überblick\n${days} Tag${days!==1?'e':''} erfasst, ${syms.length} Symptomereignis${syms.length!==1?'se':''}, Ø Intensität ${avgS}/10 (max. ${maxS}/10). Pantoprazol an ${panto}/7 Tagen.\n\n`;
  t+=`🔥 Symptomanalyse\n${topSyms.length?'Häufigste Beschwerden: '+topSyms.map(([s,n])=>'**'+s+'** ('+n+'×)').join(', ')+'.'  :'Keine Symptome dokumentiert.'}${nightS?' '+nightS+' Ereignis'+(nightS!==1?'se':'')+' nachts/im Liegen.':''}${stressS?' '+stressS+' stressbedingte Ereignis'+(stressS!==1?'se':'')+'.':''}\n\n`;
  t+=`🍽 Ernährungsanalyse\n${topTrig.length?'Zeitlicher Zusammenhang: '+topTrig.map(([m,n])=>'**„'+m+'"** ('+n+'×)').join(', ')+'. Weiter beobachten.':'Kein eindeutiger Trigger erkennbar.'}\n\n`;
  t+=`💊 Medikation\n${panto===7?'Pantoprazol täglich eingenommen.':panto===0?'**Pantoprazol nicht eingenommen** – Schlüsselwoche.':'**Pantoprazol an '+panto+'/7 Tagen**. Symptomverlauf an freien Tagen beachten.'}\n\n`;
  t+=`💡 Empfehlungen\n`;
  const r=[];
  if(topTrig.length)r.push('**„'+topTrig[0][0]+'"** vorerst meiden');
  if(nightS)r.push('Oberkörper beim Schlafen erhöhen (10–15 cm)');
  if(stressS)r.push('Stressreduktion priorisieren');
  if(panto<7&&panto>0)r.push('Pantoprazol-freie Tage systematisch ausweiten');
  r.push('Befunde beim nächsten Termin besprechen');
  t+=r.map((x,i)=>`${i+1}. ${x}.`).join('\n');
  return t;
}
</script>
</body>
</html>
